<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <script>
    const host = window.location.hostname;

    const routes = {
      "viewpoint.doubtmedia.com": "viewpoint/index.html",
    };

    // Redirect instantly without adding to browser history
    const path = routes[host] || "main/index.html";
    window.location.replace(path);
  </script>
</head>
<body>
  <p>Loading… <a id="link" href="#">Click here if not redirected</a></p>
  <script>
    document.getElementById("link").href = routes[host] || "main/index.html";
  </script>
</body>
</html>
